# Aggregated — Qwen3-235B-A22B-FP8 (3 replicas, TP8/EP8)
# 24 GPUs (3 nodes). Agg baseline for 24-GPU comparisons with prefix caching.

applications:
- name: aggregated-qwen235b
  import_path: ray.serve.llm:build_openai_app
  route_prefix: /
  args:
    llm_configs:
    - model_loading_config:
        model_id: qwen3-235b
        model_source: Qwen/Qwen3-235B-A22B-FP8
      engine_kwargs:
        tensor_parallel_size: 8
        enable_expert_parallel: true
        enable_prefix_caching: true
        max_model_len: 40960
        kv_cache_dtype: fp8
        load_format: dummy
        max_num_batched_tokens: 32768
      deployment_config:
        num_replicas: 3
        logging_config:
          enable_access_log: false
    ingress_deployment_config:
      autoscaling_config:
        min_replicas: 16
        max_replicas: 16
