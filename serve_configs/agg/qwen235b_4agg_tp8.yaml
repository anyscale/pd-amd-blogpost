# Aggregated — Qwen3-235B-A22B-FP8 (4 replicas, TP8/EP8)
# 32 GPUs (4 nodes). Agg baseline for 32-GPU comparisons.
# Used for: EXP-1b, EXP-3i

applications:
- name: aggregated-qwen235b
  import_path: ray.serve.llm:build_openai_app
  route_prefix: /
  args:
    llm_configs:
    - model_loading_config:
        model_id: qwen3-235b
        model_source: Qwen/Qwen3-235B-A22B-FP8
      engine_kwargs:
        tensor_parallel_size: 8
        enable_expert_parallel: true
        enable_prefix_caching: false
        max_model_len: 40960
        kv_cache_dtype: fp8
        load_format: dummy
        max_num_batched_tokens: 32768
      deployment_config:
        num_replicas: 4
        logging_config:
          enable_access_log: false
      runtime_env:
        env_vars:
          SAFETENSORS_FAST_GPU: '1'
          VLLM_ROCM_USE_AITER: '1'
          VLLM_ROCM_USE_AITER_MOE: '1'
          UCX_TLS: rc,sm,self,rocm_copy,rocm_ipc
          UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
          VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random
    ingress_deployment_config:
      autoscaling_config:
        min_replicas: 16
        max_replicas: 16
name: qwen235b_agg_4_tp8_service
working_dir: .
image_uri: kouroshhahkha/anyscale-rayllm:nightly-py312-rocm700
