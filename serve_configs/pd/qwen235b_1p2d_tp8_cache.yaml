# PD — Qwen3-235B-A22B-FP8 (1P2D, TP8/EP8, prefix caching)
# 24 GPUs (3 nodes). Decode-heavy with KV cache for multi-turn warm workloads.
# Used for: EXP-1c

applications:
- name: pd-qwen235b
  import_path: ray.serve.llm:build_pd_openai_app
  route_prefix: /
  args:
    prefill_config:
      model_loading_config:
        model_id: qwen3-235b
        model_source: Qwen/Qwen3-235B-A22B-FP8
      engine_kwargs:
        tensor_parallel_size: 8
        enable_expert_parallel: true
        enable_prefix_caching: true
        max_model_len: 40960
        kv_cache_dtype: fp8
        load_format: dummy
        enforce_eager: true
        max_num_batched_tokens: 32768
        max_num_seqs: 32
        kv_transfer_config:
          kv_connector: NixlConnector
          kv_role: kv_both
      deployment_config:
        num_replicas: 1
        max_ongoing_requests: 1000000
        logging_config:
          enable_access_log: false
      runtime_env: &id001
        env_vars:
          SAFETENSORS_FAST_GPU: '1'
          VLLM_ROCM_USE_AITER: '1'
          VLLM_ROCM_USE_AITER_MOE: '1'
          UCX_TLS: rc,sm,self,rocm_copy,rocm_ipc
          UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
          VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random
    decode_config:
      model_loading_config:
        model_id: qwen3-235b
        model_source: Qwen/Qwen3-235B-A22B-FP8
      engine_kwargs:
        tensor_parallel_size: 8
        enable_expert_parallel: true
        enable_prefix_caching: true
        max_model_len: 40960
        kv_cache_dtype: fp8
        load_format: dummy
        max_num_batched_tokens: 4096
        max_num_seqs: 256
        compilation_config:
          cudagraph_mode: FULL_DECODE_ONLY
        kv_transfer_config:
          kv_connector: NixlConnector
          kv_role: kv_both
      deployment_config:
        num_replicas: 2
        max_ongoing_requests: 1000000
        logging_config:
          enable_access_log: false
      runtime_env: *id001
    ingress_deployment_config:
      num_replicas: 12
      logging_config:
        enable_access_log: false
name: qwen235b_pd_1p2d_tp8_service
working_dir: .
cloud: ''
compute_config: pd-amd-mi325x
image_uri: kouroshhahkha/anyscale-rayllm:nightly-py312-rocm700
