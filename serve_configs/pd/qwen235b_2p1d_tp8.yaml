# PD — Qwen3-235B-A22B-FP8 (2P1D, TP8/EP8)
# 24 GPUs (3 nodes). Prefill-heavy ratio for long-input short-output.
# Used for: EXP-1a, EXP-3b

applications:
- name: pd-qwen235b
  import_path: ray.serve.llm:build_pd_openai_app
  route_prefix: /
  args:
    prefill_config:
      model_loading_config:
        model_id: qwen3-235b
        model_source: Qwen/Qwen3-235B-A22B-FP8
      engine_kwargs:
        tensor_parallel_size: 8
        enable_expert_parallel: true
        enable_prefix_caching: false
        max_model_len: 40960
        kv_cache_dtype: fp8
        load_format: dummy
        enforce_eager: true
        max_num_batched_tokens: 32768
        max_num_seqs: 32
        kv_transfer_config:
          kv_connector: NixlConnector
          kv_role: kv_both
      deployment_config:
        num_replicas: 2
        max_ongoing_requests: 1000000
        logging_config:
          enable_access_log: false
      runtime_env: &id001
        env_vars:
          SAFETENSORS_FAST_GPU: '1'
          VLLM_ROCM_USE_AITER: '1'
          VLLM_ROCM_USE_AITER_MOE: '1'
          UCX_TLS: rc,sm,self,rocm_copy,rocm_ipc
          UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
          VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random
    decode_config:
      model_loading_config:
        model_id: qwen3-235b
        model_source: Qwen/Qwen3-235B-A22B-FP8
      engine_kwargs:
        tensor_parallel_size: 8
        enable_expert_parallel: true
        enable_prefix_caching: false
        max_model_len: 40960
        kv_cache_dtype: fp8
        load_format: dummy
        max_num_batched_tokens: 4096
        max_num_seqs: 256
        compilation_config:
          cudagraph_mode: FULL_DECODE_ONLY
        kv_transfer_config:
          kv_connector: NixlConnector
          kv_role: kv_both
      deployment_config:
        num_replicas: 1
        max_ongoing_requests: 1000000
        logging_config:
          enable_access_log: false
      runtime_env: *id001
    ingress_deployment_config:
      num_replicas: 12
      logging_config:
        enable_access_log: false
name: qwen235b_pd_2p1d_tp8_service
working_dir: .
cloud: amd2
compute_config: amd-short-autoscale-2-10
image_uri: kouroshhahkha/anyscale-rayllm:nightly-py312-rocm700
query_auth_token_enabled: false
env_vars:
  RAY_SERVE_ENABLE_HA_PROXY: '1'
  RAY_SERVE_THROUGHPUT_OPTIMIZED: '1'
  RAY_SERVE_HAPROXY_TCP_NODELAY: '0'
  RAY_SERVE_RUN_ROUTER_IN_SEPARATE_LOOP: '1'
  SAFETENSORS_FAST_GPU: '1'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MOE: '1'
  VLLM_USE_TRITON_FLASH_ATTN: '0'
  UCX_TLS: rc_mlx5,ud_mlx5,dc_mlx5
  UCX_NET_DEVICES: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
  UCX_MEM_MMAP_HOOK_MODE: none
  VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16: '1'
