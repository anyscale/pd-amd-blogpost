# PD — Qwen3-235B-A22B  (2P2D, TP8/EP8, fp8)
#
# 2 prefill + 2 decode replicas at TP8.  32 GPUs (4 nodes).
#
# Local:    serve run serve_configs/pd/qwen235b_2p2d_tp8.yaml --app-dir ../..
# Anyscale: anyscale service deploy -f serve_configs/pd/qwen235b_2p2d_tp8.yaml

# --- Ray Serve config (used by both `serve run` and `anyscale service deploy`) ---
applications:
  - name: pd-qwen235b
    import_path: pd_app:build_pd_openai_app
    route_prefix: /

    args:
      prefill_config:
        model_loading_config:
          model_id: test-model
          model_source: Qwen/Qwen3-235B-A22B-Instruct-2507
        server_cls: pd_app.SessionAwareLLMServer
        engine_kwargs:
          tensor_parallel_size: 8
          enable_expert_parallel: true
          enable_prefix_caching: false
          max_model_len: 16384
          gpu_memory_utilization: 0.7
          max_num_batched_tokens: 32768
          kv_cache_dtype: fp8
          quantization: fp8
          load_format: dummy
          enforce_eager: true
          kv_transfer_config:
            kv_connector: NixlConnector
            kv_role: kv_both
        experimental_configs:
          stream_batching_interval_ms: 0
        deployment_config:
          max_ongoing_requests: 1000000
          logging_config:
            enable_access_log: false
          autoscaling_config: &autoscaling_timing
            min_replicas: 2
            max_replicas: 2
            metrics_interval_s: 5
            look_back_period_s: 15
            downscale_delay_s: 10
            upscale_delay_s: 10
        runtime_env:
          env_vars:
            SAFETENSORS_FAST_GPU: "1"
            VLLM_ROCM_USE_AITER: "1"
            VLLM_ROCM_USE_AITER_MOE: "1"
            UCX_TLS: "rc,sm,self,rocm_copy,rocm_ipc"
            UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1"
            VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
            VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16: "1"
            VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random

      decode_config:
        model_loading_config:
          model_id: test-model
          model_source: Qwen/Qwen3-235B-A22B-Instruct-2507
        server_cls: pd_app.SessionAwareLLMServer
        engine_kwargs:
          tensor_parallel_size: 8
          enable_expert_parallel: true
          enable_prefix_caching: false
          max_model_len: 16384
          gpu_memory_utilization: 0.7
          max_num_batched_tokens: 4096
          kv_cache_dtype: fp8
          quantization: fp8
          load_format: dummy
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          kv_transfer_config:
            kv_connector: NixlConnector
            kv_role: kv_both
        deployment_config:
          max_ongoing_requests: 1000000
          logging_config:
            enable_access_log: false
          autoscaling_config:
            <<: *autoscaling_timing
            min_replicas: 2
            max_replicas: 2
        runtime_env:
          env_vars:
            SAFETENSORS_FAST_GPU: "1"
            VLLM_ROCM_USE_AITER: "1"
            VLLM_ROCM_USE_AITER_MOE: "1"
            UCX_TLS: "rc,sm,self,rocm_copy,rocm_ipc"
            UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1"
            VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
            VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16: "1"
            VLLM_MOE_ROUTING_SIMULATION_STRATEGY: uniform_random

      ingress_deployment_config:
        logging_config:
          enable_access_log: false
        autoscaling_config:
          <<: *autoscaling_timing
          min_replicas: 4
          max_replicas: 4

      ingress_cls_config:
        ingress_cls: pd_app.SessionAwareIngress

# --- Anyscale-only fields (ignored by `serve run`) ---
name: qwen235b_pd_2p2d_tp8_service
working_dir: .
cloud: amd2
compute_config: amd-short-autoscale-2-10
image_uri: kouroshhahkha/anyscale-rayllm:nightly-py312-rocm700
query_auth_token_enabled: false
env_vars:
  RAY_SERVE_ENABLE_HA_PROXY: "1"
  RAY_SERVE_THROUGHPUT_OPTIMIZED: "1"
  RAY_SERVE_HAPROXY_TCP_NODELAY: "0"
  RAY_SERVE_RUN_ROUTER_IN_SEPARATE_LOOP: "1"
  SAFETENSORS_FAST_GPU: "1"
  VLLM_ROCM_USE_AITER: "1"
  VLLM_ROCM_USE_AITER_MOE: "1"
  VLLM_USE_TRITON_FLASH_ATTN: "0"
  UCX_TLS: "rc_mlx5,ud_mlx5,dc_mlx5"
  UCX_NET_DEVICES: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1"
  UCX_MEM_MMAP_HOOK_MODE: "none"
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: "INT4"
  VLLM_ROCM_QUICK_REDUCE_CAST_BF16_TO_FP16: "1"
  VLLM_MOE_ROUTING_SIMULATION_STRATEGY: "uniform_random"
